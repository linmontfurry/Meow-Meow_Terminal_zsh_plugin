name: Test Meow Terminal Script on Windows

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install PowerShell 7
        shell: pwsh
        run: |
          Write-Host "Checking PowerShell 7..."
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
              Write-Host "PowerShell 7 not found, installing..."
              Invoke-WebRequest -Uri "https://aka.ms/install-powershell.ps1" -OutFile "install-pwsh.ps1"
              Set-ExecutionPolicy Bypass -Scope Process -Force
              ./install-pwsh.ps1
          } else {
              Write-Host "PowerShell 7 already installed"
          }

      - name: Install Chocolatey
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              Set-ExecutionPolicy Bypass -Scope Process -Force
              [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
              Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          } else {
              Write-Host "Chocolatey already installed"
          }

      - name: Install fastfetch
        shell: pwsh
        run: |
          choco install fastfetch -y
          fastfetch --version

      - name: Run Meow Terminal script in PowerShell 7
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\meow.ps1 > output.txt
          Get-Content output.txt

      - name: Diagnostics (temporary, will be reverted)
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String | Write-Host
          Write-Host "ProcessorCount: $([Environment]::ProcessorCount)"
          $s = (Get-Counter '\Processor Information(_Total)\% Processor Utility', '\Processor(_Total)\% Processor Time' -SampleInterval 1 -MaxSamples 3).CounterSamples
          $s | Select-Object Path, CookedValue | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Write-Host '--- cache after the run'
          Get-Content "$env:LOCALAPPDATA\meow-terminal\facts"
