name: Test Meow Terminal Script on Windows

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install PowerShell 7
        shell: pwsh
        run: |
          Write-Host "Checking PowerShell 7..."
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
              Write-Host "PowerShell 7 not found, installing..."
              Invoke-WebRequest -Uri "https://aka.ms/install-powershell.ps1" -OutFile "install-pwsh.ps1"
              Set-ExecutionPolicy Bypass -Scope Process -Force
              ./install-pwsh.ps1
          } else {
              Write-Host "PowerShell 7 already installed"
          }

      - name: Install Chocolatey
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              Set-ExecutionPolicy Bypass -Scope Process -Force
              [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
              Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          } else {
              Write-Host "Chocolatey already installed"
          }

      - name: Install fastfetch
        shell: pwsh
        run: |
          choco install fastfetch -y
          fastfetch --version

      - name: Run Meow Terminal script in PowerShell 7
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\meow.ps1 > output.txt
          Get-Content output.txt

      - name: Diagnostics (temporary, will be reverted)
        shell: pwsh
        run: |
          Write-Host '--- cache file after one run'
          Get-Content "$env:LOCALAPPDATA\meow-terminal\facts"
          Write-Host '--- GPU Engine instances (first 6)'
          (Get-Counter '\GPU Engine(*)\Utilization Percentage').CounterSamples |
              Select-Object -First 6 InstanceName, CookedValue | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Write-Host '--- Win32_VideoController'
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM, PNPDeviceID | Format-List | Out-String -Width 200 | Write-Host
          Write-Host '--- display devices and their LUID property'
          foreach ($d in Get-CimInstance Win32_PnPEntity -Filter "ClassGuid = '{4d36e968-e325-11ce-bfc1-08002be10318}'") {
              $r = Invoke-CimMethod -InputObject $d -MethodName GetDeviceProperties -Arguments @{ devicePropertyKeys = [string[]]@('{60b193cb-5276-4d0f-96fc-f173abad3ec6} 2') }
              $p = @($r.deviceProperties)[0]
              Write-Host ('{0} | {1} | type={2} data={3}' -f $d.Name, $d.DeviceID, $p.Type, $p.Data)
          }
          Write-Host '--- warm run timing (3 runs)'
          1..3 | ForEach-Object { '{0:N0} ms' -f (Measure-Command { .\meow.ps1 | Out-Null }).TotalMilliseconds }
